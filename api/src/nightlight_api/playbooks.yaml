# Playbooks: what an expert does for a common problem, written down once so it runs the same way every time without
# asking the AI. Each one runs some of the helper's read-only checks, matches known causes in their output (regular
# expressions, in code), and offers the helper's fixed clean-ups as approval cards. Gemini is only needed for what no
# playbook recognises.
#
#   id, title, about: names and one line for the app
#   findings: the device findings this playbook answers (it is suggested next to them)
#   checks: helper inspect checks to run (at most 4)
#   causes: tried in order; `match` runs per line, `size` (if captured) must reach `min_gb`
#     say: plain words, {size} and other named groups are filled in
#     fix: a helper clean-up (optional); advice: what the person can do themselves (optional)
#   nothing: said when no cause matched; or {mac: ..., other: ...} when it depends on the device's system

- id: disk_full
  title: Disk filling up
  about: Finds what takes the space and offers safe clean-ups.
  findings: [f_disk]
  checks: [disk, home, docker]
  causes:
    - id: big_folder
      match: '^Biggest folder: (?P<name>.+?): (?P<size>[\d.]+ [MG]B)$'
      min_gb: 5
      say: "{name} is the biggest folder found ({size})."
      advice: Open it and sort by size; move or delete what you no longer need (Nightlight doesn't delete your own files).
    # Linux: the main disk's biggest folder wherever it is (/srv, /opt, /home...), from one bounded `du -x` pass per
    # top folder; the system's own folders (/usr, /boot...) are never named here.
    - id: big_disk_folder
      match: '^Biggest folder on the main disk: (?P<name>.+?): (?P<size>[\d.]+ [MG]B)$'
      min_gb: 2
      say: "{name} is the biggest folder on the main disk ({size})."
      advice: Move what you no longer need there to another disk, or delete it (Nightlight doesn't delete your own
        files).
    - id: unmeasured
      match: '^Not found in the measured folders: about (?P<size>[\d.]+ [MG]B) of the (?P<used>[\d.]+ [MG]B) in use \((?P<where>.+)\)$'
      min_gb: 1
      say: About {size} of the {used} in use isn't in any folder the helper could measure ({where}).
      advice: A program that still holds a deleted file open keeps its space until that program restarts.
    - id: gradle
      match: '^(?:Biggest folder: )?~/\.gradle: (?P<size>[\d.]+ [MG]B)$'
      min_gb: 2
      say: A developer build tool (Gradle, for Android/Java) keeps {size} of downloads and temporary build files.
      advice: Delete ~/.gradle/caches when no build is running; Gradle downloads what it needs again.
    - id: simulators
      match: '^(?:Biggest folder: )?~/Library/Developer: (?P<size>[\d.]+ [MG]B)$'
      min_gb: 5
      say: Apple developer tools (Xcode, simulators) take {size}.
      advice: In Terminal, "xcrun simctl delete unavailable" removes old simulators; Xcode's build data can be cleared too.
    - id: user_cache
      match: '^(?:Biggest folder: )?~/\.cache: (?P<size>[\d.]+ [MG]B)$'
      min_gb: 2
      say: Programs' temporary files (in ~/.cache) take {size}; they are rebuilt when needed.
      advice: Look inside ~/.cache and delete the folders of tools you no longer use.
    - id: trash
      match: '^Trash: (?P<size>[\d.]+ [MG]B)'
      min_gb: 0.5
      say: The Trash holds {size}.
      fix: empty_trash
    - id: xcode
      match: '^Xcode build data: (?P<size>[\d.]+ [MG]B)'
      min_gb: 1
      say: Xcode's build data takes {size}; Xcode rebuilds it when needed.
      fix: xcode_build_data
    - id: brew
      match: '^Homebrew cache: (?P<size>[\d.]+ [MG]B)'
      min_gb: 0.5
      say: A developer tool installer (Homebrew) keeps {size} of old downloads.
      fix: brew_cleanup
    - id: npm
      match: '^npm cache: (?P<size>[\d.]+ [MG]B)'
      min_gb: 0.5
      say: A programming tool's download cache (npm) takes {size}.
      fix: npm_cache
    - id: docker_images
      match: '^Images\s+\d+\s+\d+\s+[\d.]+\s*[kMG]?B\s+(?P<size>[\d.]+\s*[kMG]?B)'
      min_gb: 0.3
      say: App downloads (Docker images) that no app uses take up to {size}. The clean-up removes the unused ones
        that have no name, mostly old versions left over from updates, but also unnamed images built on this device;
        named images stay. If you build images yourself, check them with "docker image ls" first.
      fix: docker_prune
    - id: apt
      match: '^Package cache \(apt\): (?P<size>[\d.]+ [MG]B)'
      min_gb: 0.3
      say: Downloaded system updates take {size}.
      advice: Or run "sudo apt-get clean" yourself in a terminal on the device.
      fix: apt_clean
    - id: journal
      match: '^System journal: (?P<size>[\d.]+\s*[MG])'
      min_gb: 0.5
      say: The system's event diary (its log) takes {size}.
      advice: Or run "sudo journalctl --vacuum-size=200M" yourself in a terminal on the device.
      fix: journal_vacuum
    # One log (a file or a folder under /var/log, never the journal: it has its own line) that grew big. No card:
    # there is no safe recipe for deleting an app's log, so the owner rotates it through the app that writes it.
    - id: big_log
      match: '^Big log: (?P<path>/var/log/(?P<app>[^/.:]+)[^:]*): (?P<size>[\d.]+ [MG]B)$'
      min_gb: 1
      say: One app's activity file (log) takes {size} on its own, {path}. Going by its name, "{app}" writes it.
      advice: Have "{app}" keep less (most programs have a log level or log rotation setting; a debug log can usually
        be switched off). If deeper checks with a passkey are set up for this device, Investigate deeply can propose the
        exact command to shrink it, for you to approve.
    - id: app_caches
      match: '^App caches: (?P<size>[\d.]+ [MG]B)'
      min_gb: 2
      say: App caches take {size}. Apps rebuild them, but clearing them is best done app by app.
      advice: In each app's settings, look for "Clear cache"; or quit an app and remove its folder in ~/Library/Caches.
    - id: downloads
      match: '^Downloads: (?P<size>[\d.]+ [MG]B)'
      min_gb: 2
      say: The Downloads folder holds {size}.
      advice: Sort Downloads by size and delete the installers and videos you no longer need.
    - id: mac_private
      match: '^Not checked \(macOS privacy\)'
      say: Downloads, Desktop, Documents, Movies and the Trash weren't checked, because macOS asks the person at the Mac first.
      advice: To include them, run "nightlight settings" once at the Mac and click Allow when macOS asks.
  nothing:
    mac: None of the usual places is large. The space is probably in your own files (Documents, Movies, Photos).
    other: None of the places measured is large, so the space is outside them (in a folder the helper can't read, or
      on another disk).

- id: slow
  title: Running slowly
  about: Finds what keeps it busy.
  findings: [f_mem]
  checks: [processes, load]
  causes:
    - id: busy_program
      match: '^(?P<mem>[\d.]+)% mem, (?P<cpu>[\d.]+)% cpu, (?P<name>.+)$'
      min_value: {mem: 15}
      say: "{name} uses {mem}% of the memory."
      advice: Quit {name} if you don't need it now, or restart it if it has been open for days.
    - id: busy_cpu
      match: '^(?P<mem>[\d.]+)% mem, (?P<cpu>[\d.]+)% cpu, (?P<name>.+)$'
      min_value: {cpu: 80}
      say: "{name} keeps a processor core busy ({cpu}% CPU)."
      advice: If {name} isn't doing something you asked for, quit or restart it.
    - id: overloaded
      match: '^Processor overloaded: over the last minute (?P<load>[\d.]+) programs on average wanted the processor at once, with (?P<cores>\d+) cores?'
      say: The processor is overloaded. Over the last minute, {load} programs on average wanted it at once, and it has
        {cores} core(s), so programs wait their turn.
  nothing: No single program stands out in this sample, and the processor isn't overloaded.

- id: no_internet
  title: Internet problems
  about: Checks name lookup (DNS) and the connection.
  findings: []
  checks: [network]
  causes:
    - id: dns
      match: '^Name lookup \(DNS\): (FAILED|no answer)'
      say: The device can't look up names (DNS), so websites won't open even if the line works.
      advice: Restart the router; if it keeps happening, set the DNS server to 1.1.1.1 or 8.8.8.8.
    - id: offline
      match: '^Internet \(HTTPS\): NOT reachable'
      say: Names resolve, but the device can't reach the internet.
      advice: Check the cable or Wi-Fi, then restart the router.
  nothing: Name lookup and the internet both work from this device right now.

- id: updates
  title: Updates waiting
  about: Lists what is waiting to be installed.
  findings: [f_updates, f_uptime]
  checks: [updates]
  causes:
    - id: macos
      match: '^macOS updates: (?P<list>(?!none).+)$'
      say: "System updates are waiting: {list}."
      advice: Install them from System Settings > General > Software Update when a restart suits you.
    - id: apt
      match: '^(?P<count>[1-9]\d*) package updates waiting'
      say: "{count} software updates (packages) are waiting."
      advice: Run "sudo apt update && sudo apt upgrade" when nothing important is running.
    - id: brew
      match: '^Homebrew outdated \((?P<count>[1-9]\d*)\)'
      say: "{count} developer tools installed with Homebrew have newer versions."
      advice: Run "brew upgrade" when you have a few minutes.
  nothing: Nothing is waiting to be installed.

- id: after_restart
  title: Why it restarted
  about: Looks at how the device last started and what it recorded about crashes.
  findings: []
  checks: [restarts, disk]
  causes:
    - id: unclean
      match: '^The last start was NOT clean'
      say: The last restart wasn't clean (no shutdown was recorded before it), so it crashed, froze or lost power.
    - id: panic
      match: '^Crash reports: (?P<when>.+)$'
      say: "The system recorded a crash report ({when})."
    - id: clean
      match: '^The last start was clean'
      say: It was shut down or restarted normally before it went silent.
  nothing: It couldn't tell how the device last started.
