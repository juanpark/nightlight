# How Nightlight works: the product's own guide. The agent reads it through the `how_nightlight_works` tool and
# repeats it instead of inventing steps; the same text can render a Help page. Keep each topic short, exact and in
# plain words. {web} is replaced by the app's address.

add_device:
  title: Add a device
  text: |
    In the app, choose "Add a device" and "Get my line". Paste that line into the Terminal on the device (Mac:
    Applications > Utilities > Terminal; Raspberry Pi or Linux: a terminal or SSH session) and press Enter; it works
    once, for 10 minutes. The helper installs itself as a background service and the device appears on the map within
    a minute. It asks one question: whether the app may manage what Nightlight is allowed to do there.
    If you can't paste a line on that device, run `curl -fsSL {web}/install.sh | sh` there instead: it shows a code
    like WXYZ-1234, and you type it in the app ("Use a code it shows instead") to approve it.
    Nightlight never logs in to your devices: the helper on the device dials out to Nightlight, nothing dials in.

found_nearby:
  title: Find other devices nearby (and the lines on the map)
  text: |
    Under "Found nearby", choose "Look for devices nearby": one of your devices on each network (one whose
    permissions are changed from the app, with an up-to-date helper) looks around and lists what answers, each thing once, with a guess at what each thing is, its maker, model, the
    name it announces (unless you turned names off in Settings) and services. No address leaves the device. Add what you want to watch; adding your router lets the map draw "connected through"
    lines to it. A device whose permissions are set only on the device itself (strict) looks only when someone runs
    `nightlight discover` on it (or `~/.local/bin/nightlight discover` if the shell says "command not found").
    Lines between your devices are drawn three ways: by you (drag from one device to another), by me when you tell
    me how two devices relate, and automatically from what the helpers see (Time Machine, shared folders, services
    in use, the router), matched by fingerprints so no address is ever sent.

remove_device:
  title: Remove a device
  text: |
    Ask in the chat ("remove Sadika's Mac") or open the device and choose "Remove this device…". You get a card to
    approve. If the device is reporting, its helper uninstalls itself (stops the background service, deletes its
    files and its key) and the device leaves the map. If it isn't reporting, its access is cut at once and the helper
    stops by itself when it next wakes up; to clean the files off it, run this on the device:
    curl -fsSL {web}/uninstall.sh | sh
    A removed device's history, notes and activity are kept (archived) for 30 days, then deleted for good; the app
    has no button to delete them sooner. Adding the same machine again later makes it a new device.

uninstall_by_hand:
  title: Uninstall the helper by hand
  text: |
    On the device, in a terminal: curl -fsSL {web}/uninstall.sh | sh
    It stops the background service, deletes the helper's files and tells Nightlight the device left.

update_helper:
  title: Update the helper
  text: |
    When a new helper is released, the device shows "Update available" in the app; tap Update. The device downloads
    it, installs it only if it carries Nightlight's signature (checked on the device), is newer and passes a
    self-test, then restarts itself. The previous version is kept: on the device, `nightlight rollback` goes back.
    You can also ask in the chat ("update the helper on all my devices"): you get one approval card per device that
    has an update waiting. You can let a device install signed updates automatically (device settings in the app).
    Helpers older than 0.9 can't update themselves: run the add-device line on them once.

what_the_helper_does:
  title: What the helper can and can't do
  text: |
    It reports health every minute (disk, memory, processor, containers, failed services, updates waiting) and runs
    only a fixed list of jobs: read-only checks (why something stopped, disk use, busiest programs, network, updates),
    restarting a stopped app (container) or background service, and safe clean-ups (empty the Trash, clear caches
    that rebuild themselves, remove leftover app downloads), installing signed helper updates and removing itself. Restarts,
    clean-ups and removal need your approval (a card or your confirmation in the app); updates install when you tap
    Update, or by themselves if you switched that on. It can't run any other command, open a remote shell, or move
    your files; it reads file contents only for recent log lines of apps you allowed. The one exception is expert
    sessions, which are off unless you set them up on that device: then a command that changes something runs only
    if you signed that exact command with your passkey, and read-only commands run during an investigation you
    approved with one passkey tap (15 minutes, no further taps; the device itself refuses anything that isn't
    read-only). Apart from those passkey-signed requests, the cloud sends job names, never commands, and the device
    checks every job against what its owner allowed. Approval cards protect against
    mistakes; the real limit is what the device itself allows, which a hacked account or server can't widen beyond
    what the device's owner delegated.
    The helper runs on Macs and Linux machines (a Raspberry Pi, a Linux server or NAS). Windows isn't supported yet;
    Nightlight can still watch whether a Windows PC answers on the network (Found nearby), and phones, routers,
    printers and cameras can only be watched that way too.

ssh_and_remote_access:
  title: Remote access (SSH, screen sharing)
  text: |
    Nightlight has no way into your devices, on purpose: no SSH, no remote shell, no open ports. The helper only dials
    out. That is why a stolen Nightlight account or a hacked server can't take over your machines. To get a shell on
    a device, use your own tools (SSH, Screen Sharing, a keyboard at the machine); Nightlight tells you what to look
    at and runs its fixed checks and fixes for you.

silent_device:
  title: A device stopped reporting
  text: |
    Nightlight can't reach in, so it reasons from what it knows: when the device last reported and for how long it
    has been silent, and whether other devices in the same place still report. If they do, the internet there is
    probably fine and the likely causes are on the device itself: asleep, turned off, logged out, or off Wi-Fi. These
    are possibilities, not a diagnosis; if its last report showed a nearly full disk, that is the most likely cause (a
    full disk can freeze or crash a computer). History under the device shows the gaps. When it reports again,
    Nightlight checks by itself why: a clean restart or a crash, which crash reports were written, how full the disk
    was; the answer goes to Activity and the device's notebook. Things to check at the device: is it
    on and awake (Macs: System Settings > Energy, "Prevent automatic sleeping"); is it on the network; on a Mac the
    helper runs while you are logged in.

permissions:
  title: What Nightlight may do on a device
  text: |
    Each device chose once, at install, where its permissions are changed: from the app (switches in the device's
    Settings tab: check why something stopped and look around, read recent log lines, clean up space, restart
    specific apps, install signed updates) or only on the device itself, also called strict (only what was allowed
    there; change it there with `nightlight settings`).
    Restarts and clean-ups always ask you with a card, in both modes.

mac_privacy:
  title: Mac privacy prompts
  text: |
    macOS protects Downloads, Desktop, Documents, Movies and the Trash with a prompt. Nightlight never reads them from
    the background unless you allowed it, so no dialog pops up on a Mac nobody is watching. Installing asks once
    (with an up-to-date helper): say yes and click Allow when macOS asks, and the helper measures their sizes (and can
    empty the Trash after your OK) from then on. Changing your mind later is the only time it needs the Mac's
    terminal again: `nightlight settings`.

what_leaves_the_device:
  title: What leaves the device
  text: |
    Health numbers, container and service names and states, the number of updates waiting, and results of checks you
    allowed (folder sizes, program names, update names; recent log lines only for apps you allowed). Never files or
    addresses. To draw lines between your devices by itself (this Mac backs up to that NAS), it sends scrambled
    fingerprints of local addresses, made with a key only your account's devices get: your devices can be matched to
    each other, but the addresses never leave them. For things it finds nearby it sends what they seem to be and,
    when they announce it, their maker and model ("Brother HL-L2350DW"): only a maker from a fixed list of known
    brands, and a model only when it is an Apple model from a fixed list or looks like a product code. It also sends
    the names they announce ("Living Room", "Juans-MacBook-Pro"), because this is your own dashboard: that is on by
    default, and the switch for names of things nearby in Settings turns it off (names already kept are removed
    too). Addresses never leave the device either way. Anything that looks like a password, key or address is hidden on the device before it is
    sent, and again in the cloud; that hiding is careful but can't catch every possible secret, which is why the
    helper collects as little as it can in the first place.

memories:
  title: What Nightlight remembers
  text: |
    Four kinds: the conversation (this chat, kept 30 days and shown again when you come back); each device's
    profile ("About this device": what it is, what runs there, quirks, past incidents and fixes; Nightlight rewrites it
    after investigating and you can edit it); each device's notebook (dated notes); and things about you
    (preferences such as "never restart anything during my work calls", saved only when you tell it, forgotten with
    "Forget what you know about me").

checkups_and_cleanups:
  title: Checkups and clean-ups
  text: |
    A checkup is a fixed list of steps an expert would follow for a common problem (disk filling up, running slowly, internet
    problems, updates waiting) that run the same way every time without AI: it measures, recognises the usual causes
    and puts up a card for each safe clean-up the device allows. Open a device and use "Checkups", or ask in the chat.

approvals_and_trust:
  title: Approval cards and trust
  text: |
    Restarts, clean-ups and removals on a real device come as a card (what it will do, what it affects, whether it
    can be undone, and the exact command where there is one) and run only after you approve. Helper updates run when
    you tap Update, or by themselves if you allowed that. Earning trust step by step works only on the sample home
    for now: there, after the same safe, routine kind of job (cleaning up logs, removing leftover app downloads,
    backing up the game world) has gone well three times, Nightlight offers to do that kind on its own and tell you
    afterwards. Restarts and updates never get that offer; they always ask. The Trust panel shows each kind's step
    and can move it back, and a failure moves it back a step by itself. On your own devices,
    every restart and clean-up asks you each time. Jobs that can't be undone always ask.

sample_home:
  title: The sample home
  text: |
    A simulated home (a Raspberry Pi, a NAS, a game server...) to try Nightlight without installing anything. Show or
    hide it from the menu; "Reset the sample home" (under More, Demo tools) starts it over. Real devices you add are never touched by a reset.

expert_sessions:
  title: Expert sessions (real commands, signed with your passkey)
  text: |
    For problems the usual checks don't cover, Nightlight can investigate with real commands, like a system
    administrator. A passkey is a key that lives on your phone or computer and is unlocked by your face, fingerprint
    or PIN; Nightlight keeps only its public half, and the device checks your signature itself, so even Nightlight's
    own servers can't run a command without you. Set it up once, signed in with Google at Nightlight's own address
    (not the demo): open the device in the app, then its Settings tab, "Expert sessions" > "Create my passkey" (Face
    ID, Touch ID, Windows Hello, a phone by QR code, or a security key), then on the device run `nightlight expert`
    (or `~/.local/bin/nightlight expert` if the shell says "command not found") and confirm it shows the same code.
    Each device is switched on this way, one by one; without it a device keeps working with the fixed checks and
    fixes. After that: read-only commands (logs, disk use, running programs, network) need one passkey tap per 15
    minutes; any command that changes something comes as a card you sign with your passkey. A card is valid for 15
    minutes, then expires; ask again for a fresh one. The device refuses anything unsigned, expired, meant for
    another device, or (in an investigation) anything that could change something or read where secrets are kept.
    There is no fallback by email or SMS code, on purpose. `nightlight expert --off` on the device turns it off
    there; the app has no button yet to remove the passkey itself. Full guide: docs/PASSKEYS.md in the repository.

investigate_mode:
  title: Investigate deeply
  text: |
    Choose "Investigate deeply" (the switch under the chat) to let Nightlight dig in step by step: it forms
    hypotheses, runs its standard checks, reads the results and tries again, then tells you what it checked, what it
    found, the likely cause and what to do. It runs its own read-only commands only on a device where you set up
    expert sessions, and each 15 minutes of that needs your passkey; otherwise it uses the standard checks only. It is slower (up to a few minutes) and costs a few cents.

device_knowledge:
  title: What Nightlight keeps per device (notes, fixes that worked here, job log)
  text: |
    Each device has its own folder, like an administrator keeps for a machine. The profile ("About this device") says
    what it is and how it is set up. The notebook holds short dated notes from you and from Nightlight, for the device
    as a whole or for one service on it (the Minecraft server, an app). "Fixes that worked here" (saved fixes) are
    kept as steps ("Clear old app downloads"): Nightlight saves one after a fix worked and offers it the next
    time the same problem shows up. A saved fix never runs by itself: using it puts its steps up as cards you approve
    (an expert command still needs your passkey). The log lists every job that ran on the device, newest first: what
    it was, who started it, whether it worked and what it reported. Nightlight reads all of this before it looks into
    a device. Saved fixes can be renamed or deleted and notes deleted from the device's Knowledge tab; passwords, keys and
    addresses are never kept.
