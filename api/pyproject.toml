[project]
name = "nightlight-api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "juanpark", email = "juanpark@me.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "firebase-admin>=7.7.0",
    "google-adk[gcp]>=2.12.0",
    "google-cloud-agentplatform>=2.5.0",
    "google-cloud-firestore>=2.34.1",
    "google-genai>=2.31.0",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nightlight-api = "nightlight_api:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
